<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b2124">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Karantina — zombi hayatta kalma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b2124;--night-2:#252d31;--night-3:#313a3f;--line:rgba(235,229,213,.13);
  --ink:#ebe5d5;--dust:#a3a89f;--tape:#e2b23a;--tape-ink:#1f1b0e;--spray:#c4342c;--water:#5c9bb0;--leaf:#8aa860;--violet:#9686c2;
  --ui:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  --paint:'Rubik Spray Paint','Barlow Condensed',Impact,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--night:#1b2124;--night-2:#252d31;--night-3:#313a3f;--line:rgba(235,229,213,.13);--ink:#ebe5d5;--dust:#a3a89f;--tape:#e2b23a;--tape-ink:#1f1b0e;--spray:#c4342c;--water:#5c9bb0;--leaf:#8aa860;--violet:#9686c2}}
:root[data-theme="dark"]{--night:#1b2124;--night-2:#252d31;--night-3:#313a3f;--line:rgba(235,229,213,.13);--ink:#ebe5d5;--dust:#a3a89f;--tape:#e2b23a;--tape-ink:#1f1b0e;--spray:#c4342c;--water:#5c9bb0;--leaf:#8aa860;--violet:#9686c2}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#111517;color:var(--ink);font-family:var(--ui);font-size:16px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.hide{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

/* Oyun içi gösterge */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto}
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px))}
#bars{display:grid;gap:6px;width:clamp(118px,31vw,168px);padding:9px 10px;border-radius:12px;background:rgba(17,21,23,.66);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.bar{display:grid;grid-template-columns:15px 1fr;align-items:center;gap:7px}
.bar svg{width:15px;height:15px;display:block}
.bar span{height:6px;border-radius:3px;background:rgba(235,229,213,.13);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:3px;transform-origin:left center;transition:transform .35s linear}
.bar.low svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
#clock{text-align:center;padding:6px 12px;border-radius:12px;background:rgba(17,21,23,.5);min-width:80px}
#cday{font-size:15px;color:var(--dust);font-weight:600}
#ctime{font-size:25px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
#tbtns{display:flex;gap:8px}
.ib{width:46px;height:46px;border-radius:12px;background:rgba(17,21,23,.66);display:grid;place-items:center;position:relative;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ib svg{width:23px;height:23px}
.ib .dot{position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--spray)}
#moods{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(124px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.mood{font-size:16px;font-weight:600;padding:3px 10px 3px 8px;border-radius:8px;background:rgba(17,21,23,.74);border-left:3px solid var(--tape)}
.mood.bad{border-left-color:var(--spray)}
#toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:max-content;max-width:min(80vw,420px);padding:8px 14px;border-radius:10px;background:rgba(17,21,23,.88);font-size:18px;font-weight:600;text-align:center;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;font-family:var(--paint);font-size:clamp(46px,13vw,92px);color:var(--ink);opacity:0;transition:opacity .9s;text-shadow:0 3px 16px rgba(0,0,0,.7)}
#banner.on{opacity:.94}
#hint{position:fixed;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:100px;height:100px;border-radius:50%;border:2px dashed rgba(235,229,213,.22);display:grid;place-items:center;color:rgba(235,229,213,.5);font-size:16px;font-weight:600;text-align:center;line-height:1.1}
#stick{position:fixed;left:0;top:0;width:140px;height:140px;margin:-70px 0 0 -70px;pointer-events:none;opacity:0;transition:opacity .12s}
#stick.on{opacity:1}
#stick .base{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(235,229,213,.32);background:rgba(17,21,23,.22)}
#stick .knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(235,229,213,.5);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#pad{position:fixed;right:0;bottom:0;padding:0 calc(14px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 0;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#ctxRow{display:flex;gap:6px;align-items:center}
#bCtx{min-height:50px;max-width:min(62vw,320px);padding:0 16px;border-radius:12px;background:var(--tape);color:var(--tape-ink);font-weight:700;font-size:19px;line-height:1.1;box-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bMore{min-width:50px;height:50px;padding:0 10px;border-radius:12px;background:rgba(17,21,23,.8);border:1px solid var(--line);font-weight:700;font-size:18px}
#padMain{display:flex;align-items:flex-end;gap:10px}
#modes{display:flex;flex-direction:column;gap:8px}
.mb{width:60px;height:46px;border-radius:12px;background:rgba(17,21,23,.72);border:1px solid var(--line);font-weight:700;font-size:18px}
.mb.on{background:var(--ink);color:var(--night);border-color:transparent}
#bAtk{width:102px;height:102px;border-radius:50%;background:rgba(170,40,34,.9);border:3px solid rgba(255,240,220,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 5px 16px rgba(0,0,0,.45);transition:transform .06s}
#bAtk.held{transform:scale(.94)}
#atkIco{font-size:32px;line-height:1}
#atkLbl{font-size:15px;font-weight:700;max-width:88px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#atkSub{font-size:14px;opacity:.85;min-height:15px;font-variant-numeric:tabular-nums}

/* Alt panel */
#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,10,11,.5)}
#sheet{width:min(100%,560px);max-height:calc(100% - 16px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--night);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 18px;flex:none}
.sh-title{font-size:25px;font-weight:700;flex:1;line-height:1.1}
.sh-title small{display:block;font-size:16px;font-weight:500;color:var(--dust)}
.x{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--night-2);font-size:21px;flex:none}
.tabs{display:flex;gap:6px;padding:0 14px 10px;flex:none}
.tab{flex:1;height:44px;border-radius:10px;background:var(--night-2);font-weight:600;font-size:18px;color:var(--dust)}
.tab.on{background:var(--ink);color:var(--night)}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;padding:0 10px 16px;min-height:0}
.wt{display:flex;align-items:center;gap:10px;padding:2px 8px 10px;color:var(--dust);font-size:16px}
.wt span{flex:1;height:6px;border-radius:3px;background:var(--night-3);overflow:hidden}
.wt i{display:block;height:100%;background:var(--leaf)}
.wt.over i{background:var(--spray)}
.wt.over{color:#ffb3ab}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 2px 6px}
.slot{padding:8px 10px;border-radius:10px;background:var(--night-2);min-height:56px}
.slot em{display:block;font-style:normal;font-size:14px;color:var(--dust)}
.slot b{font-size:16px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{font-size:15.5px;color:var(--dust);font-weight:600;padding:12px 8px 4px}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:56px;padding:6px 8px;border-radius:10px;text-align:left}
.row.sel{background:var(--night-2)}
.row .ico{font-size:26px;text-align:center;line-height:1}
.row .nm{font-size:19px;font-weight:600;line-height:1.15;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:15px;color:var(--dust);display:block;line-height:1.2}
.row .q{font-size:18px;font-weight:700;color:var(--dust);font-variant-numeric:tabular-nums;text-align:right}
.row .q em{display:block;font-style:normal;font-size:14px;font-weight:600;color:var(--tape)}
.eq{color:var(--tape)}
.cond{display:inline-block;width:42px;height:5px;border-radius:3px;background:var(--night-3);vertical-align:middle;margin-left:4px;overflow:hidden}
.cond i{display:block;height:100%;background:var(--leaf)}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:2px 8px 12px 56px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;background:var(--night-3);font-weight:600;font-size:18px}
.btn.pri{background:var(--tape);color:var(--tape-ink)}
.btn.bad{color:#ffaaa0}
.empty{padding:16px 10px;color:var(--dust);font-size:17px;line-height:1.35}
.bulk{display:flex;gap:8px;padding:0 4px 6px}
.rcp{padding:12px;border-radius:12px;background:var(--night-2);margin:0 2px 8px;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center}
.rcp .ico{font-size:27px;text-align:center}
.rcp b{font-size:19px}
.rcp p{margin:2px 0 0;color:var(--dust);font-size:16px;line-height:1.25}
.need{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.need span{font-size:15px;padding:2px 8px;border-radius:6px;background:var(--night-3)}
.need .no{color:#ffaaa0}
.stat-l{display:grid;grid-template-columns:1fr auto;gap:7px 12px;padding:4px 10px 10px;font-size:18px;margin:0}
.stat-l dt{color:var(--dust)}
.stat-l dd{margin:0;font-weight:600;text-align:right}
.wound{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--night-2);margin:0 2px 6px;font-size:18px;min-height:56px}
.wound b{flex:1;font-weight:600}
.wound .tag{font-size:15px;padding:3px 9px;border-radius:6px;background:var(--night-3)}
.wound .tag.bl{background:rgba(196,52,44,.28);color:#ffb3ab}
#mapc{display:block;width:100%;height:300px;border-radius:12px;background:#0d1012}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 6px 0;font-size:16px;color:var(--dust)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.menu-l{display:grid;gap:8px;padding:2px 4px 6px}
.menu-l .btn{min-height:54px;font-size:20px;text-align:left;padding:0 18px}
.help{padding:0 10px 6px;font-size:18px;line-height:1.4}
.help p{margin:0 0 12px;max-width:62ch}
.help b{color:var(--tape);font-weight:600}

/* Tam ekranlar */
#screen{position:fixed;inset:0;z-index:30;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));isolation:isolate}
.scr-c{margin:auto 0;display:flex;flex-direction:column;align-items:center;width:100%}
#screen.dim{background:radial-gradient(120% 90% at 50% 45%,rgba(17,21,23,.2),rgba(10,12,13,.9))}
#screen.black{background:#07090a}
.logo{font-family:var(--paint);font-weight:400;font-size:clamp(54px,min(17vw,21vh),136px);color:var(--spray);line-height:.95;margin:0;transform:rotate(-4deg);letter-spacing:.01em;text-shadow:0 0 22px rgba(196,52,44,.2)}
.lede{font-size:21px;line-height:1.3;max-width:26ch;text-align:center;margin:20px 0 24px;font-style:italic;font-weight:500}
.mm{display:grid;gap:10px;width:min(320px,88vw)}
.mbtn{min-height:56px;border-radius:12px;font-size:22px;font-weight:700;background:rgba(27,33,36,.92);border:1px solid var(--line)}
.mbtn.pri{background:var(--tape);color:var(--tape-ink);border-color:transparent}
.rec{margin:16px 0 0;color:var(--dust);font-size:17px;text-align:center}
.tapeband{position:absolute;left:-10%;right:-10%;top:calc(13% + env(safe-area-inset-top,0px));height:38px;background:var(--tape);color:var(--tape-ink);transform:rotate(5deg);display:flex;align-items:center;gap:34px;overflow:hidden;white-space:nowrap;font-weight:700;font-size:20px;letter-spacing:.08em;box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none;z-index:-1}
.tapeband span{flex:none}
.scr-h{font-size:31px;font-weight:700;margin:0 0 4px;text-align:center;line-height:1.1}
.scr-p{font-size:18px;color:var(--dust);margin:0 0 16px;text-align:center}
.jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(560px,100%)}
@media (orientation:landscape) and (min-width:700px){.jobs{grid-template-columns:repeat(4,minmax(0,1fr));width:min(920px,100%)}}
.job{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:14px;background:rgba(27,33,36,.95);border:1px solid var(--line);min-height:150px}
.job b{font-size:24px;line-height:1.05}
.job p{margin:0;font-size:16.5px;line-height:1.25;color:var(--dust)}
.job .kit{margin-top:auto;font-size:16px;line-height:1.35}
.job:active{border-color:var(--tape)}
.back{margin-top:14px;width:min(320px,88vw)}
.intro{max-width:28ch;text-align:center;font-size:24px;line-height:1.4;font-style:italic;font-weight:500}
.intro p{margin:0 0 14px;opacity:0;animation:fade 1.3s forwards}
.intro p:nth-child(2){animation-delay:1.4s}
.intro p:nth-child(3){animation-delay:2.9s;color:#e0574e;font-weight:700;font-size:30px;line-height:1.15}
.intro .tap{margin-top:30px;font-size:16px;color:var(--dust);font-style:normal;animation-delay:3.6s}
.intro .still{opacity:1;animation:none}
@keyframes fade{to{opacity:1}}
.dead-k{font-size:21px;font-style:italic;color:var(--dust);margin:0;text-align:center}
.dead-t{font-family:var(--paint);font-weight:400;font-size:clamp(46px,14vw,98px);color:var(--spray);margin:8px 0 12px;line-height:1;text-align:center}
.dead-l{list-style:none;margin:0 0 24px;padding:0;text-align:center;font-size:20px;line-height:1.5;max-width:34ch}

#atkCol{display:flex;flex-direction:column;align-items:center;gap:8px}
#atkTop{display:flex;gap:8px;height:44px;align-items:center;justify-content:center}
.sb{min-width:46px;height:44px;padding:0 8px;border-radius:12px;background:rgba(17,21,23,.72);border:1px solid var(--line);font-weight:700;font-size:18px}
#bReload{background:rgba(150,134,194,.92);color:#16131f;border-color:transparent;font-size:16px}
.tabs .tab{font-size:16px;padding:0 2px}
.tw{color:#ffd28a}.tb{color:#ffaaa0}.dim{color:var(--dust);font-weight:500}
.job .pts{font-size:15px;font-weight:700;color:var(--tape)}
.tr-wrap{width:min(680px,100%)}
.tr-pts{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 12px;margin:0 0 12px;border-radius:12px;background:rgba(27,33,36,.97);border:1px solid var(--line)}
.tr-pts span{flex:1;font-size:18px;color:var(--dust)}
.tr-pts b{font-size:30px;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.tr-pts b.neg{color:#ff9d93}
.grp2{font-size:18px;color:var(--dust);font-weight:600;margin:4px 2px 8px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
@media (min-width:620px){.chips{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chip{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border-radius:12px;background:rgba(27,33,36,.95);border:1px solid var(--line);min-height:66px}
.chip b{font-size:18px;display:flex;justify-content:space-between;gap:6px;line-height:1.1}
.chip b em{font-style:normal;color:var(--dust);font-weight:600}
.chip span{font-size:15px;color:var(--dust);line-height:1.2}
.chip.on{border-color:var(--tape);background:rgba(226,178,58,.15)}
.chip.neg.on{border-color:var(--spray);background:rgba(196,52,44,.18)}
.wr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--night-2);margin:0 2px 6px;min-height:58px}
.wr .sl{width:52px;flex:none;color:var(--dust);font-size:15px}
.wr .ico{font-size:24px;width:30px;text-align:center;flex:none}
.wr b{flex:1;font-size:17px;font-weight:600;min-width:0;line-height:1.2}
.wr b small{display:block;color:var(--dust);font-size:14px;font-weight:500}
.skr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 12px;border-radius:10px;margin:0 2px 5px;background:var(--night-2)}
.skr b{font-size:17px;font-weight:600}
.skr em{font-style:normal;font-weight:700;color:var(--tape);font-variant-numeric:tabular-nums}
.skr span{grid-column:1/-1;height:5px;border-radius:3px;background:var(--night-3);overflow:hidden}
.skr i{display:block;height:100%;background:var(--violet)}
.trl{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px 8px}
.trl span{font-size:15px;padding:3px 10px;border-radius:8px;background:var(--night-2)}
.trl .neg{color:#ffb3ab}
#mapView{position:fixed;inset:0;z-index:45;background:#1a1f22;touch-action:none}
#mapc2{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mv-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 14px calc(16px + env(safe-area-inset-left,0px));background:linear-gradient(rgba(17,21,23,.88),rgba(17,21,23,0));pointer-events:none}
.mv-top .x{pointer-events:auto}
.mv-title{flex:1;font-size:25px;font-weight:700;line-height:1.1}
.mv-title small{display:block;font-size:15px;font-weight:500;color:var(--dust)}
.mv-btns{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.mv-btns button{width:52px;height:52px;border-radius:12px;background:rgba(17,21,23,.88);border:1px solid var(--line);font-size:26px;font-weight:700;line-height:1}
@media (max-width:420px){#top{gap:6px}#bars{width:max(104px,30vw);padding:8px 9px}#clock{min-width:60px;padding:5px 8px}#ctime{font-size:22px}#cday{font-size:14px}#tbtns{gap:6px}.ib{width:42px;height:42px}.ib svg{width:21px;height:21px}#moods{top:calc(116px + env(safe-area-inset-top,0px))}}
@media (max-height:480px){.lede{margin:10px 0 14px;font-size:18px}.mm{gap:8px}.mbtn{min-height:48px;font-size:20px}.dead-t{font-size:clamp(40px,min(14vw,18vh),98px);margin:4px 0 8px}.dead-l{font-size:18px;line-height:1.4;margin-bottom:14px}.scr-h{font-size:26px}.scr-p{margin-bottom:10px}.job{min-height:0;padding:10px 12px}.job p{font-size:15px}#moods{top:calc(112px + env(safe-area-inset-top,0px))}.mood{font-size:14px;padding:2px 8px 2px 7px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.intro p{opacity:1}}
@media (orientation:landscape) and (max-height:520px){
  #top{padding-top:calc(6px + env(safe-area-inset-top,0px))}
  #bars{width:150px;gap:4px;padding:7px 9px}
  .bar span{height:5px}
  #clock{padding:4px 10px;min-width:70px}
  #ctime{font-size:21px}
  .ib{width:42px;height:42px}
  #moods{top:calc(104px + env(safe-area-inset-top,0px))}
  .mood{font-size:14px;padding:2px 8px 2px 7px}
  #pad{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
  #bAtk{width:96px;height:96px}
  .mb{height:42px;width:56px}
  #bCtx{min-height:46px;font-size:18px}
}
.bigcode{font-family:var(--paint);font-size:clamp(54px,16vw,96px);line-height:1.05;color:var(--tape);letter-spacing:.12em;margin:0 0 6px}
.plist{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:6px;width:min(320px,88vw)}
.plist li{padding:10px 14px;border-radius:10px;background:rgba(27,33,36,.92);border:1px solid var(--line);font-size:19px;font-weight:600;text-align:left}
.joinrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.codein{font:inherit;font-size:28px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;text-align:center;min-height:56px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:rgba(27,33,36,.95);color:var(--ink);-webkit-user-select:text;user-select:text;touch-action:manipulation;width:100%;min-width:0}
.codein.nick{letter-spacing:.04em;text-transform:none;font-size:22px}
.codein:focus{outline:2px solid var(--tape);outline-offset:1px}
#rotate{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:rgba(10,12,13,.92);padding:24px}
#rotate.hide{display:none}
.rot-box{text-align:center;display:grid;gap:14px;justify-items:center;max-width:300px}
.rot-box svg{width:72px;height:72px;color:var(--tape)}
.rot-box p{margin:0;font-size:20px;line-height:1.3}
</style>

const COOKED = { csucuk: 1, cpotato: 1, cegg: 1, steak: 1, cchicken: 1, cfish: 1 };

    if (COOKED[e.id]) mul *= (1 + 0.05 * lvl('cook')) * (P.job === 'chef' ? 1.3 : 1);

    say(sickMsg || (d.cat === 'food' ? pick(['Fena değil.', 'Midem biraz doldu.', 'Bunu özlemişim.']) : pick(['Oh, su.', 'Boğazım rahatladı.'])), sickMsg ? 1 : 0);
    return;
  }
  if (d.band) {

    if (!w) { if (d.heal) { P.hp = Math.min(100, P.hp + d.heal); take(P.inv, e.id, 1); say('Biraz daha iyiyim.', 0); } else toast('Sarılacak bir yaran yok.'); return; }

/* ================= Uyku, zaman, olaylar ================= */
function trySleep() {
  if (P.fat < 30) { say('Uykum yok.', 0); return; }
  if (G.mp) { startAct({ lbl: 'Dinleniyor', dur: 12, done: () => { P.fat = Math.max(0, P.fat - 35); P.end = 100; say('Biraz dinlendim. Çevrimiçi oyunda zaman durmaz.', 0); } }); return; }
  if (P.wounds.some(w => w.bl)) { say('Kanarken uyuyamam.', 1); return; }
  const danger = G.zs.some(z => !z.dead && ((z.mem > 0 && Math.hypot(z.x - P.x, z.y - P.y) < 22) || (vis[(z.y | 0) * W + (z.x | 0)] && Math.hypot(z.x - P.x, z.y - P.y) < 15)));
  if (danger) { say('Yakında zombiler var. Şimdi uyuyamam.', 1); return; }
  sleepScreen(clamp(Math.round(P.fat / 11), 3, 9));
}
function infDmg(a, b) { let d = 0; for (let h = a; h < b; h += 0.25) d += infRate(h) * Math.min(0.25, b - h); return d; }
function doSleep(h) {
  P.hun = Math.min(100, P.hun + 1.6 * h * hunM()); P.thi = Math.min(100, P.thi + 2.6 * h * thiM());
  P.fat = Math.max(0, P.fat - 11.5 * h); P.end = 100; P.lv.fat = 0; P.pan = 0;
  for (const w of P.wounds) w.age += h * 60;
  P.wounds = P.wounds.filter(w => w.bl || w.age < healTime(w));
  let dmg = 0, cause = '';
  if (P.infected) { const a = P.inf; P.inf += h; const d = infDmg(a, P.inf); if (d) { dmg += d; cause = 'enf'; } }
  if (P.sick > 0) { const s = Math.min(P.sick, h); dmg += 3 * s; P.sick -= s; if (!cause) cause = 'zehir'; }
  if (P.hun >= 100) { dmg += 5 * h; cause = 'aclik'; }
  if (P.thi >= 100) { dmg += 8 * h; cause = 'susuzluk'; }
  const sympt = P.infected && P.inf > P.incub;
  if (!sympt && P.sick <= 0 && P.hun < 80 && P.thi < 80) P.hp = Math.min(100, P.hp + 3 * h * healM());
  G.time += h * 60;
  for (const z of G.zs) { z.mem = 0; z.tm = 0; for (let i = 0; i < 6; i++) wander(z, 0.5); }
  const woke = R() < 0.22 && spawnNear();
  timeEvents();
  visDirty = true; flowDirty = true;
  if (dmg > 0) hurt(dmg, cause);
  if (!P.dead) say(woke ? 'Bir gürültüyle uyandım!' : pick(['Biraz dinlendim.', 'Kâbuslar... ama uyudum.', 'Yeni bir gün.']), woke ? 1 : 0);
}
function timeEvents() {
  const d = dayOf(G.time);

      if (NET.host) { G.time += dt * TS; timeEvents(); updZombies(dt); updHeli(dt); flowT -= dt; if (flowT <= 0 || flowDirty) { computeFlow(); flowT = 0.45; flowDirty = false; } }

  }

  if (!NET.on || NET.host) G.rain = clamp(G.rain + (G.rainOn ? 1 : -1) * dt * 0.15, 0, 1);
  if (G.storm && G.rain > 0.6 && R() < dt * 0.06) { G.flashT = 0.25; setTimeout(() => sfx('thunder', 0.8), rf(300, 1800)); }

}
